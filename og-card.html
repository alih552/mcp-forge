<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box}
  .card{width:1200px;height:630px;background:radial-gradient(1100px 700px at 80% -10%, #1a1f33 0%, #0a0b0e 60%);
    color:#e7e9ee;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .brand{font-size:30px;font-weight:700;letter-spacing:.3px}
  .brand b{color:#5ee0c0}
  h1{font-size:64px;line-height:1.08;margin:26px 0 0;letter-spacing:-1px;max-width:980px;font-weight:800}
  h1 .hl{color:#8a98ff}
  .stat{margin-top:30px;font-size:26px;color:#9aa3b2}
  .stat b{color:#ff6b6b}
  .row{display:flex;align-items:center;justify-content:space-between}
  .chip{display:inline-block;border:1px solid #242833;background:#12141a;border-radius:999px;
    padding:10px 20px;font-size:20px;color:#5ee0c0}
  .url{font-size:24px;color:#cfd4de;font-weight:600}
  .glow{position:absolute;right:-120px;bottom:-160px;width:460px;height:460px;border-radius:50%;
    background:radial-gradient(circle,#6675ff55,transparent 65%);filter:blur(10px)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="glow"></div>
  <div class="brand">MCP <b>Forge</b></div>
  <div>
    <h1>Find and fix the <span class="hl">security holes</span> in your MCP servers</h1>
    <div class="stat"><b>41%</b> of public MCP servers require no authentication. What does yours score?</div>
  </div>
  <div class="row">
    <span class="chip">Free scanner, no install</span>
    <span class="url">alih552.github.io/mcp-forge</span>
  </div>
</div>
</body>
</html>
